<!DOCTYPE html>
<html>
<head>

<title>Ink Books Login</title>

<style>

body{
    font-family:Arial;
    background:#f5f7fa;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.login-box{
    background:white;

    padding:40px;

    border-radius:15px;

    width:350px;

    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1e3a8a;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;

    background:#1e3a8a;

    color:white;

    border:none;

    cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<form action="/login_submit" method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

</div>

</body>
</html>
