<!DOCTYPE html>
<html>
<head>

    <title>{{ title }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f7fa;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.1);
            text-align:center;
            width:100%;
            max-width:500px;
        }

        .icon{
            font-size:70px;
            margin-bottom:15px;
        }

        h1{
            color:#dc2626;
            margin-bottom:15px;
        }

        p{
            color:#555;
            font-size:18px;
            line-height:1.6;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 25px;
            background:#1e3a8a;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

        .btn:hover{
            background:#172554;
        }

        @media(max-width:768px){

            .card{
                padding:25px;
            }

            h1{
                font-size:24px;
            }

            p{
                font-size:16px;
            }

        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">❌</div>

        <h1>{{ title }}</h1>

        <p>{{ message }}</p>

        <a href="/" class="btn">
            Back To Home
        </a>

    </div>

</body>
</html>
